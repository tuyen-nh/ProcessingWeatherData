apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: bigdata
spec:
  replicas: 2          # replaces spark-worker-1 and spark-worker-2
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      enableServiceLinks: false   # same Service-env-injection collision guard
      initContainers:
        - name: wait-for-spark-master
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z spark-master 7077; do echo waiting for spark-master; sleep 3; done']
      containers:
        - name: spark-worker
          image: spark:3.5.8-scala2.12-java11-ubuntu
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master:7077
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
