apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-weather-analytics
  namespace: bigdata
spec:
  # Chạy mỗi ngày lúc 1:00 AM
  schedule: "0 1 * * *"

  # Không cho phép 2 job chạy cùng lúc (nếu job trước chưa xong)
  concurrencyPolicy: Forbid

  # Giữ lại log của 3 lần chạy gần nhất để debug
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      # Tự retry nếu fail (tối đa 2 lần)
      backoffLimit: 2

      template:
        spec:
          restartPolicy: OnFailure

          containers:
            - name: spark-batch
              # Dùng cùng image với spark-master trong project
              image: spark:3.5.8-scala2.12-java11-ubuntu

              command:
                - /opt/spark/bin/spark-submit
                - --master
                - spark://spark-master.bigdata.svc.cluster.local:7077
                - --deploy-mode
                - client
                # cronjob pod's user.home is /nonexistent → redirect Ivy's package
                # cache to a writable dir so --packages can resolve
                - --conf
                - spark.jars.ivy=/tmp/.ivy2
                # client-mode driver runs in THIS pod; advertise the pod IP so
                # executors can connect back (the pod hostname isn't DNS-resolvable).
                # k8s substitutes $(POD_IP) from the env var below.
                - --conf
                - spark.driver.host=$(POD_IP)
                - --conf
                - spark.driver.bindAddress=0.0.0.0
                # Cap resources so the batch fits even while the streaming jobs
                # run (cluster = 2048 MB total; streaming uses ~1280 MB).
                - --total-executor-cores
                - "1"
                - --executor-memory
                - "512m"
                - --packages
                - org.mongodb.spark:mongo-spark-connector_2.12:3.0.1
                - --class
                - tn.insat.tp3.BatchWeatherAnalytics
                - /opt/spark/app/app.jar

              env:
                - name: POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP

              # JAR shared from spark-master via the spark-app-jar PVC
              volumeMounts:
                - name: app-jar
                  mountPath: /opt/spark/app

              # Giới hạn tài nguyên
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "500m"
                limits:
                  memory: "2Gi"
                  cpu: "1000m"

          volumes:
            - name: app-jar
              persistentVolumeClaim:
                claimName: spark-app-jar
